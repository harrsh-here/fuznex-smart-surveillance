name: Checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Contract tests use NumPy fixtures but must not download ML runtimes or
      # model weights in CI.
      - run: python -m pip install "numpy>=1.26,<3"
      - run: python -m unittest discover -s tests -v
